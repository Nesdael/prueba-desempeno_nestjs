services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetcore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - fleetcore-data:/var/lib/postgresql/data
    networks:
      - fleetcore-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: fleetcore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT}
      APP_NODE: ${APP_NODE}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      API_KEYS: ${API_KEYS}
    ports:
      - '${APP_PORT}:${APP_PORT}'
    networks:
      - fleetcore-network

volumes:
  fleetcore-data:

networks:
  fleetcore-network: